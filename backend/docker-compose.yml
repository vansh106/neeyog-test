services:
  # ── PostgreSQL ─────────────────────────────────────────────
  # LOCAL DEVELOPMENT ONLY. Gated behind the "local" profile so it does
  # not start by default when the primary DB is Supabase.
  # Start with:   docker-compose --profile local up -d
  #        or:    docker-compose -f docker-compose.local.yml up -d
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cpq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quotation_system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d quotation_system"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - local

  redis:
    image: redis:7-alpine
    container_name: cpq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # pgAdmin — local-only, depends on the local Postgres.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cpq_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - local

  # The API container uses whatever DATABASE_URL is set in .env — Supabase
  # in production, or the local Postgres when started with the "local"
  # profile + .env.local. Do NOT override DATABASE_URL here.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpq_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Redis still points at the in-cluster service name.
      REDIS_URL: redis://redis:6379/0
      PDF_OUTPUT_DIR: /app/output/pdfs
    volumes:
      - ./output:/app/output
    depends_on:
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
