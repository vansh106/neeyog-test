services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cpq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quotation_system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d quotation_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cpq_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cpq_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpq_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host-local URLs for in-cluster service names
      DATABASE_URL: postgresql+asyncpg://admin:localpassword@postgres:5432/quotation_system
      DATABASE_URL_SYNC: postgresql://admin:localpassword@postgres:5432/quotation_system
      REDIS_URL: redis://redis:6379/0
      PDF_OUTPUT_DIR: /app/output/pdfs
    volumes:
      - ./output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
